; Anti-Productivity Bubbles (APB) settings.
; The file is reloaded automatically within about a second after you save it.
; Missing or invalid values fall back to the defaults shown here.

[Bubbles]
; Number of bubbles per monitor (1-64)
Count=15
; Bubble diameter in pixels (random between Min and Max)
DiameterMin=200
DiameterMax=300
; Rising speed in pixels per second (random between Min and Max)
SpeedMin=30
SpeedMax=60

[Sway]
; Horizontal sway amplitude in pixels (random between Min and Max)
AmplitudeMin=24
AmplitudeMax=48
; Sway angular speed in radians per second (random between Min and Max)
RateMin=0.35
RateMax=0.7

[Refraction]
; Refraction strength (0 = none, 0.55 = default, higher = stronger distortion)
Strength=0.55

[Input]
; Key that exits the app. Examples: Esc, Q, F12, Space, Enter, Pause, or a hex virtual-key code such as 0x1B.
; Combine keys with +, e.g. LShift+Esc, Ctrl+Alt+Q (modifiers: Shift/LShift/RShift, Ctrl/LCtrl/RCtrl, Alt/LAlt/RAlt, Win). The last key triggers the exit while the others are held.
; Esc + Left Shift + Left Ctrl ALWAYS exits, regardless of this setting.
ExitKey=Esc

[Power]
; Behavior while running on battery: Normal (no change), Reduce (lower frame rate), Pause (hide bubbles)
OnBattery=Normal
; Frame rate used when OnBattery=Reduce (5-60)
BatteryFps=30

; Per-monitor overrides. The number is the display number shown in Windows
; Settings > System > Display > Identify (\\.\DISPLAYn). Remove the leading ';' to use.
; Enabled=0 hides bubbles on that monitor. Count overrides [Bubbles] Count for it.
;[Monitor2]
;Enabled=1
;Count=10
